name: Нераспознанная строка кил-фида
description: Программа не поняла сообщение из боя. Самая полезная помощь.
title: "Кил-фид: "
labels: ["killfeed"]
body:
  - type: markdown
    attributes:
      value: |
        Игра пишет сообщения на языке клиента, и формулировки меняются с
        патчами. Собрать их может только тот, кто в это играет.

        Строки берутся в самой программе: **Настройки → Показать
        нераспознанные строки**.

  - type: textarea
    id: lines
    attributes:
      label: Строки как есть
      description: >
        Целиком, без правок — со скобками, значками и юникодом. Именно их
        форма и ломает разбор.
      placeholder: |
        [CLAN] Player1 (Т-80БВМ) вывел из строя Player2 (M1A2 SEP V2)
        Player1 (Т-80БВМ) получил "Название награды: x3"
      render: text
    validations:
      required: true

  - type: input
    id: lang
    attributes:
      label: Язык клиента игры
      placeholder: русский / English / 简体中文
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Режим
      options:
        - Наземные бои
        - Воздушные бои
        - Морские бои
        - Смешанный / не помню
    validations:
      required: true

  - type: textarea
    id: meaning
    attributes:
      label: Что это значило в бою
      description: >
        Если знаете. «Игрок сбил дрон», «награда за спасение союзника» —
        по названию это не всегда очевидно, а разбору важно.

  - type: checkboxes
    id: privacy
    attributes:
      label: Чужие ники
      options:
        - label: >
            Чужие ники заменены на Player1, Player2 — с сохранением формы
            (клан-тег в тех же скобках, иероглифы иероглифами)
          required: true
